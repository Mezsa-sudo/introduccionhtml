<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas — Curso HTML</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        

        /* RESET */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        header h1{
            text-align: center;
            color: white;
            font-size: 40px;
            margin-bottom: 20px;
        }

        /* IMAGEN */
        header img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: absolute;
            left: 20px;
            top: 15px;
        }

        /* NAV */
        nav{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        nav a{
            text-decoration: none;
            color: white;
            padding: 8px 12px;
            transition: 0.3s;
            font-size: 20px;
        }

        nav a:hover{
            color: black;
        }

        /* TITULO */
        body h1{
            color: white;
            text-align: center;
            margin-top: 40px;
            font-size: 40px;
        }

        /* TABLA */
        table{
            width: 70%;
            margin: 40px auto;
            border-collapse: collapse;
            background-color: rgb(177, 11, 227);
            color: white;
            border: 4px solid rgb(43, 42, 42);
            border-radius: 10px;
            overflow: hidden;
            font-size: 22px;
        }

        /* CELDAS */
        th,
        td{
            border: 2px solid rgb(43, 42, 42);
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="topbar">
    <img src="./img/images.png" alt="logo" onerror="this.style.display='none'">
    <span class="topbar-title">// CURSO_HTML — MÓDULO_TABLAS</span>
    <nav class="topbar-nav">
        <a href="contenedor.html">Contenedor</a>
        <a href="lista.html">Listas</a>
        <a href="tabla.html" class="active">Tablas</a>
        <a href="formulario.html">Formulario</a>
        <a href="boostrap.html">Bootstrap</a>
        <a href="Portafolio.html">Portafolio</a>
        <a href="index.html">Inicio</a>
    </nav>
</div>

<main>
    <div class="prompt">tabla.html <div class="prompt-cur"></div></div>

    <div class="section-tag">// módulo_tablas</div>
    <div class="section-header"><h2>> TABLAS</h2></div>

    <table class="terminal-table reveal">
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Edad</th>
        </tr>
        <tr>
            <td>Arturo</td>
            <td>Heredia</td>
            <td>17</td>
        </tr>
        <tr>
            <td>Emir</td>
            <td>OLMOS</td>
            <td>17</td>
        </tr>
    </table>
</main>

<footer>
    <div class="footer-text">// CURSO_HTML — <a href="index.html">[Inicio]</a></div>
    <div id="clock"></div>
    <div class="footer-text">HTML · CSS · JS</div>
</footer>

<script src="matrix.js"></script>
</body>
</html>
