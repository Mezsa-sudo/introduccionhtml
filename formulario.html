<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario — Curso HTML</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="topbar">
    <img src="./img/images.png" alt="logo" onerror="this.style.display='none'">
    <span class="topbar-title">// CURSO_HTML — MÓDULO_FORMULARIO</span>
    <nav class="topbar-nav">
        <a href="contenedor.html">Contenedor</a>
        <a href="lista.html">Listas</a>
        <a href="tabla.html">Tablas</a>
        <a href="formulario.html" class="active">Formulario</a>
        <a href="boostrap.html">Bootstrap</a>
        <a href="Portafolio.html">Portafolio</a>
        <a href="index.html">Inicio</a>
    </nav>
</div>

<main>
    <div class="prompt">formulario.html <div class="prompt-cur"></div></div>

    <section>
        <div class="section-tag">// módulo_formulario</div>
        <div class="section-header"><h2>> FORMULARIO</h2></div>

        <div class="form-terminal reveal">
            <div class="form-topbar">
                <span class="form-topbar-dot"></span><span class="form-topbar-dot"></span><span class="form-topbar-dot"></span>
                <span class="form-topbar-title">// formulario_demo.sh</span>
            </div>

            <form class="form-body" onsubmit="return false;">

                <div class="form-row">
                    <div class="form-field">
                        <label class="form-label">// nombre</label>
                        <input class="form-input" type="text" placeholder="NOMBRE">
                    </div>
                    <div class="form-field">
                        <label class="form-label">// apellido</label>
                        <input class="form-input" type="text" placeholder="APELLIDO">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label class="form-label">// edad</label>
                        <input class="form-input" type="text" placeholder="00">
                    </div>
                    <div class="form-field">
                        <label class="form-label">// email</label>
                        <input class="form-input" type="email" placeholder="usuario@dominio.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label class="form-label">// fecha_de_nacimiento</label>
                        <input class="form-input" type="datetime-local">
                    </div>
                    <div class="form-field">
                        <label class="form-label">// programador</label>
                        <select class="form-input form-select">
                            <option value="">Eliga una opción</option>
                            <option value="">Des FRONTEND</option>
                            <option value="">Des BACKEND</option>
                            <option value="">Líder de equipo</option>
                            <option value="">Senior PYTHON</option>
                        </select>
                    </div>
                </div>

                <div class="form-field">
                    <label class="form-label">// género</label>
                    <div class="form-checkbox-group">
                        <label class="form-checkbox-label">
                            <input type="checkbox" class="form-checkbox">
                            <span class="form-checkbox-custom"></span>
                            Masculino
                        </label>
                        <label class="form-checkbox-label">
                            <input type="checkbox" class="form-checkbox">
                            <span class="form-checkbox-custom"></span>
                            Femenino
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <span class="form-prompt-pre">root@curso:~$</span>
                    <button type="button" class="form-submit">guardar.sh →</button>
                </div>

            </form>
        </div>
    </section>
</main>

<footer>
    <div class="footer-text">// CURSO_HTML — <a href="index.html">[Inicio]</a></div>
    <div id="clock"></div>
    <div class="footer-text">HTML · CSS · JS</div>
</footer>

<script src="matrix.js"></script>
</body>
</html>
